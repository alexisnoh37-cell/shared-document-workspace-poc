{% extends "base.html" %}
{% block title %}rhwp HWPX Spike{% endblock %}
{% block content %}
<div class="page-heading">
  <div>
    <a class="back-link" href="{{ url_for('documents.index') }}">← 전체 자료</a>
    <h1>rhwp HWPX Spike</h1>
    <p>실제 체크인 없이 load → no-op export → Kordoc 검증을 수행합니다.</p>
  </div>
  <span class="status-pill status-editing">개발 진단</span>
</div>

<div id="rhwp-spike"
     data-studio-url="{{ studio_url }}"
     data-source-template="{{ url_for('rhwp_spike.source', filename='__SAMPLE__') }}"
     data-analyze-url="{{ url_for('rhwp_spike.analyze') }}">
  <div class="card card-body mb-3 shadow-sm">
    <div class="row g-3 align-items-end">
      <div class="col-md-6">
        <label class="form-label" for="spike-sample">샘플 HWPX</label>
        <select class="form-select" id="spike-sample">
          {% for sample in samples %}<option value="{{ sample }}">{{ sample }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-6 action-row">
        <button class="btn btn-primary" id="spike-load" type="button">편집기에 로드</button>
        <button class="btn btn-outline-primary" id="spike-noop" type="button" disabled>no-op export 검증</button>
        <button class="btn btn-outline-secondary" id="spike-download" type="button" disabled>export 다운로드</button>
      </div>
    </div>
    <div id="spike-status" class="mt-3 text-secondary" role="status">편집기 초기화 중…</div>
    <pre id="spike-result" class="error-detail mt-3 d-none"></pre>
  </div>
  <div id="rhwp-editor-container" class="rhwp-editor-container"></div>
</div>
{% endblock %}
{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/rhwp_spike.js') }}"></script>
{% endblock %}
